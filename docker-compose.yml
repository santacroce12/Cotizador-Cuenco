services:
  cotizador:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cotizador-cuenco
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      PORT: 8000
      DATA_DIR: /app/data
      DATABASE_PATH: /app/data/database.db
      UPLOADS_PRODUCTOS_DIR: /app/static/uploads/productos
    volumes:
      - ./data:/app/data
      - ./storage/uploads/productos:/app/static/uploads/productos
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/login', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 25s
