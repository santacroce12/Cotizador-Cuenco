{% extends "layout.html" %}

{% block content %}
<style>
    .historial-actions {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 0.55rem;
        flex-wrap: wrap;
    }

    .historial-action-main {
        display: inline-flex;
        justify-content: flex-end;
        gap: 0.55rem;
        flex-wrap: wrap;
    }

    .historial-action-main .btn,
    .historial-action-menu .btn {
        min-height: 38px;
        border-radius: 12px;
        font-weight: 700;
    }

    .historial-table-wrap {
        overflow: visible !important;
    }

    .historial-table {
        overflow: visible !important;
    }

    .historial-table tbody,
    .historial-table tr,
    .historial-table td {
        overflow: visible !important;
    }

    .historial-action-menu {
        position: relative;
    }

    .historial-action-menu .dropdown-toggle {
        min-width: 78px;
        white-space: nowrap;
    }

    .historial-action-menu .dropdown-menu {
        min-width: 220px;
        padding: 0.45rem;
        border: 1px solid rgba(148, 163, 184, 0.22);
        border-radius: 14px;
        box-shadow: 0 14px 28px rgba(15, 23, 42, 0.12);
        z-index: 1080;
    }

    .historial-action-menu .dropdown-item {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        border-radius: 10px;
        padding: 0.6rem 0.75rem;
        font-weight: 600;
    }

    .historial-action-menu .dropdown-item i {
        width: 1rem;
        text-align: center;
    }

    @media (max-width: 991px) {
        .historial-table-wrap {
            overflow-x: auto !important;
            overflow-y: visible !important;
        }

        .historial-actions,
        .historial-action-main {
            justify-content: flex-start;
        }
    }
</style>
<div class="card p-4 page-surface">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-dark m-0"><i class="bi bi-clock-history"></i> Historial de Cotizaciones</h2>
        <div class="btn-group" role="group" aria-label="Filtro moneda">
            <button id="btn-moneda-todas" type="button" class="btn btn-sm btn-dark-custom active" onclick="setFiltroMoneda('')">Todas</button>
            <button id="btn-moneda-ars" type="button" class="btn btn-sm btn-outline-dark" onclick="setFiltroMoneda('ARS')">Solo ARS</button>
            <button id="btn-moneda-usd" type="button" class="btn btn-sm btn-outline-dark" onclick="setFiltroMoneda('USD')">Solo USD</button>
        </div>
    </div>

    <div class="row g-3 mb-4 p-3 surface-strip">
        <div class="col-md-4">
            <label class="small fw-bold text-muted text-uppercase">Buscar Cliente</label>
            <select id="filtro_cliente_id" class="form-select">
                <option value="">Buscar por nombre, razon social o CUIT...</option>
                {% for c in clientes %}
                <option
                    value="{{ c.id }}"
                    data-data='{{ {"nombre": c.nombre or "", "razon": c.razon_social or "", "cuit": c.cuit or ""}|tojson|safe }}'
                >
                    {{ c.nombre }}{% if c.razon_social %} | {{ c.razon_social }}{% endif %}{% if c.cuit %} ({{ c.cuit }}){% endif %}
                </option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-3">
            <label class="small fw-bold text-muted text-uppercase">Desde</label>
            <input type="date" id="filtro_desde" class="form-control">
        </div>
        <div class="col-md-3">
            <label class="small fw-bold text-muted text-uppercase">Hasta</label>
            <input type="date" id="filtro_hasta" class="form-control">
        </div>
        <div class="col-md-2 d-flex align-items-end">
            <button onclick="aplicarFiltros()" class="btn btn-primary w-100">
                <i class="bi bi-search"></i> Filtrar
            </button>
        </div>
    </div>

    <div class="table-responsive table-grid-outline historial-table-wrap">
        <table class="table table-custom align-middle historial-table">
            <thead class="historial-header">
                <tr>
                    <th>Nro</th>
                    <th>Cliente</th>
                    <th>Fecha</th>
                    <th class="text-center">Estado</th>
                    <th class="text-end">Total Final ($)</th>
                    <th class="text-end">Acciones</th>
                </tr>
            </thead>
            <tbody id="tabla-historial"></tbody>
        </table>
    </div>
    <div id="historial-paginacion" class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mt-3"></div>
</div>

<script>
let filtroMoneda = "";
let historialClienteTomSelect = null;
let historialPage = 1;
const historialPuedeEliminar = {{ "true" if current_user and current_user.is_admin else "false" }};
document.addEventListener("DOMContentLoaded", function () {
    initHistorialClienteSelect();
    aplicarFiltros();
});

function initHistorialClienteSelect() {
    const select = document.getElementById("filtro_cliente_id");
    if (!select || typeof TomSelect === "undefined" || select.tomselect) {
        return;
    }

    historialClienteTomSelect = new TomSelect(select, {
        maxItems: 1,
        create: false,
        allowEmptyOption: true,
        closeAfterSelect: true,
        plugins: ["clear_button"],
        searchField: ["text", "nombre", "razon", "cuit"],
        sortField: [
            { field: "$score" },
            { field: "text" },
        ],
        placeholder: "Buscar por nombre, razon social o CUIT...",
        render: {
            option: function (data, escape) {
                const nombre = data.nombre || data.text || "";
                const razon = data.razon || "";
                const cuit = data.cuit || "";
                return `
                    <div class="cliente-option flex-column align-items-start">
                        <strong>${escape(nombre)}</strong>
                        ${razon ? `<small>${escape(razon)}</small>` : ""}
                        ${cuit ? `<small>${escape(cuit)}</small>` : ""}
                    </div>
                `;
            },
            item: function (data, escape) {
                const nombre = data.nombre || data.text || "";
                const razon = data.razon || "";
                return `<div class="cliente-item">${escape(razon ? `${nombre} - ${razon}` : nombre)}</div>`;
            },
            no_results: function (data, escape) {
                return `<div class="no-results py-2 px-3 text-muted">Sin coincidencias para "${escape(data.input)}"</div>`;
            },
        },
        onChange: function () {
            historialPage = 1;
            aplicarFiltros();
        },
    });
}

function setFiltroMoneda(moneda) {
    filtroMoneda = moneda;
    historialPage = 1;
    document.getElementById("btn-moneda-todas").className = `btn btn-sm ${moneda === "" ? "btn-dark-custom active" : "btn-outline-dark"}`;
    document.getElementById("btn-moneda-ars").className = `btn btn-sm ${moneda === "ARS" ? "btn-dark-custom active" : "btn-outline-dark"}`;
    document.getElementById("btn-moneda-usd").className = `btn btn-sm ${moneda === "USD" ? "btn-dark-custom active" : "btn-outline-dark"}`;
    aplicarFiltros();
}

function claseEstado(estado) {
    if (estado === "Aceptada") {
        return "estado-aceptada";
    }
    if (estado === "Rechazada") {
        return "estado-rechazada";
    }
    return "estado-en-progreso";
}

function renderHistorialPaginacion(meta) {
    const contenedor = document.getElementById("historial-paginacion");
    if (!contenedor) {
        return;
    }
    if (!meta || !meta.total) {
        contenedor.innerHTML = "";
        return;
    }

    const resumen = `<div class="small text-muted">Mostrando <strong>${meta.start}</strong> a <strong>${meta.end}</strong> de <strong>${meta.total}</strong> cotizaciones</div>`;
    const paginas = (meta.pages_visible || []).map((page) => {
        if (page === null) {
            return `<li class="page-item disabled"><span class="page-link">...</span></li>`;
        }
        const active = page === meta.page ? " active" : "";
        return `<li class="page-item${active}"><button type="button" class="page-link" onclick="irPaginaHistorial(${page})">${page}</button></li>`;
    }).join("");

    const prevDisabled = meta.has_prev ? "" : " disabled";
    const nextDisabled = meta.has_next ? "" : " disabled";
    contenedor.innerHTML = `
        ${resumen}
        <nav aria-label="Paginacion historial">
            <ul class="pagination pagination-sm mb-0">
                <li class="page-item${prevDisabled}">
                    <button type="button" class="page-link" ${meta.has_prev ? `onclick="irPaginaHistorial(${meta.prev_page})"` : ""}>Anterior</button>
                </li>
                ${paginas}
                <li class="page-item${nextDisabled}">
                    <button type="button" class="page-link" ${meta.has_next ? `onclick="irPaginaHistorial(${meta.next_page})"` : ""}>Siguiente</button>
                </li>
            </ul>
        </nav>
    `;
}

function irPaginaHistorial(page) {
    historialPage = page;
    aplicarFiltros();
}

function eliminarCotizacion(id, numeroCotizacion) {
    if (!historialPuedeEliminar) {
        return;
    }
    const confirmado = window.confirm(`Estas seguro de querer borrar por completo la cotizacion #${numeroCotizacion}? Esta accion no se puede deshacer.`);
    if (!confirmado) {
        return;
    }

    fetch(`/cotizacion/${id}/eliminar`, {
        method: "POST",
        headers: {
            "X-Requested-With": "XMLHttpRequest",
        },
    })
        .then((response) => response.json().then((data) => ({ ok: response.ok, status: response.status, data })))
        .then(({ ok, status, data }) => {
            if (!ok) {
                if (status === 401 && data?.error === "auth_required") {
                    window.location.href = "{{ url_for('login') }}";
                    return;
                }
                if (status === 403 && data?.error === "admin_required") {
                    alert("Solo un administrador puede borrar cotizaciones.");
                    return;
                }
                alert(data?.error || "No se pudo borrar la cotizacion.");
                return;
            }
            aplicarFiltros(historialPage);
        })
        .catch(() => {
            alert("No se pudo borrar la cotizacion.");
        });
}

function clonarCotizacion(id, numeroCotizacion) {
    const confirmado = window.confirm(`Crear una copia de la cotizacion #${numeroCotizacion} con fecha actual y estado En progreso?`);
    if (!confirmado) {
        return;
    }

    fetch(`/cotizacion/clonar/${id}`, {
        method: "POST",
        headers: {
            "X-Requested-With": "XMLHttpRequest",
        },
    })
        .then((response) => response.json().then((data) => ({ ok: response.ok, status: response.status, data })))
        .then(({ ok, status, data }) => {
            if (!ok) {
                if (status === 401 && data?.error === "auth_required") {
                    window.location.href = "{{ url_for('login') }}";
                    return;
                }
                alert(data?.error || "No se pudo duplicar la cotizacion.");
                return;
            }
            const destino = data?.redirect_url || (data?.nueva_id ? `/cotizacion/${data.nueva_id}/editar` : "");
            if (destino) {
                window.location.href = destino;
                return;
            }
            aplicarFiltros(historialPage);
        })
        .catch(() => {
            alert("No se pudo duplicar la cotizacion.");
        });
}

function aplicarFiltros(page = historialPage) {
    const clienteSelect = document.getElementById("filtro_cliente_id");
    const clienteId = clienteSelect?.value || "";
    const clienteTexto = clienteSelect?.tomselect?.control_input?.value?.trim() || "";
    const desde = document.getElementById("filtro_desde").value;
    const hasta = document.getElementById("filtro_hasta").value;
    const params = new URLSearchParams({ desde, hasta });
    historialPage = page || 1;
    params.set("page", historialPage);
    if (clienteId) {
        params.set("cliente_id", clienteId);
    } else if (clienteTexto) {
        params.set("cliente", clienteTexto);
    }
    if (filtroMoneda) {
        params.set("moneda", filtroMoneda);
    }

    fetch(`/filtrar_historial?${params.toString()}`)
        .then((response) => response.json())
        .then((data) => {
            if (!data || !Array.isArray(data.items)) {
                if (data && data.error === "auth_required") {
                    window.location.href = "{{ url_for('login') }}";
                }
                return;
            }
            const tbody = document.getElementById("tabla-historial");
            tbody.innerHTML = "";
            renderHistorialPaginacion(data.pagination);

            if (data.items.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted p-4">No se encontraron cotizaciones para este filtro.</td></tr>`;
                return;
            }

            data.items.forEach((c, index) => {
                const numeroCot = c.numero_cotizacion || String(c.id).padStart(4, "0");
                const estado = c.estado || "En progreso";
                const estadoClass = claseEstado(estado);
                const menuDirectionClass = index >= Math.max(data.items.length - 2, 0) ? "dropup" : "dropdown";
                const moneda = (c.moneda || "ARS").toUpperCase();
                const icono = moneda === "USD" ? "bi-currency-dollar text-success" : "bi-cash-stack text-primary";
                const tagMoneda = moneda === "USD"
                    ? `<span class="moneda-tag tag-usd">USD</span>`
                    : `<span class="moneda-tag tag-ars">ARS</span>`;
                const totalNumerico = Number(c.total_final || 0);
                const totalFormateado = totalNumerico.toLocaleString("es-AR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

                tbody.innerHTML += `
                    <tr>
                        <td><span class="badge bg-secondary">#${numeroCot}</span></td>
                        <td>
                            <i class="bi ${icono} me-2"></i><strong class="text-dark">${c.cliente_nombre || c.cliente || "Sin Cliente"}</strong>
                            ${c.familia ? `<div><small class="text-muted text-uppercase" style="font-size: 0.7rem;"><i class="bi bi-tag-fill me-1"></i>${c.familia}</small></div>` : ""}
                        </td>
                        <td>${c.fecha}</td>
                        <td class="text-center">
                            <span id="estado-badge-${c.id}" class="estado-pill ${estadoClass}">${estado}</span>
                        </td>
                        <td class="text-end fw-bold">${tagMoneda}$ ${totalFormateado}</td>
                        <td class="text-end">
                            <div class="historial-actions">
                                <div class="historial-action-main">
                                    <a href="/cotizacion/${c.id}/editar" class="btn btn-sm btn-edit-custom">
                                        <i class="bi bi-pencil-square"></i> Editar
                                    </a>
                                    <a href="/cotizacion/${c.id}" class="btn btn-sm btn-view-custom">
                                        <i class="bi bi-eye"></i> Ver online
                                    </a>
                                </div>
                                <div class="${menuDirectionClass} historial-action-menu">
                                    <button type="button" class="btn btn-sm btn-outline-secondary dropdown-toggle" data-bs-toggle="dropdown" data-bs-boundary="viewport" aria-expanded="false">
                                        Más
                                    </button>
                                    <ul class="dropdown-menu dropdown-menu-end">
                                        <li>
                                            <button type="button" class="dropdown-item" onclick="clonarCotizacion(${c.id}, '${numeroCot}')">
                                                <i class="bi bi-copy text-warning"></i> Duplicar
                                            </button>
                                        </li>
                                        <li>
                                            <a href="/cotizacion/${c.id}/llave-en-mano" class="dropdown-item">
                                                <i class="bi bi-file-text"></i> Consolidada
                                            </a>
                                        </li>
                                        <li>
                                            <a href="/cotizacion/${c.id}/xlsx" class="dropdown-item">
                                                <i class="bi bi-file-earmark-excel text-success"></i> Exportar Excel
                                            </a>
                                        </li>
                                        <li>
                                            <a href="/cotizacion/${c.id}?download=1" class="dropdown-item">
                                                <i class="bi bi-file-earmark-pdf text-danger"></i> Descargar PDF
                                            </a>
                                        </li>
                                        ${historialPuedeEliminar ? `
                                        <li><hr class="dropdown-divider"></li>
                                        <li>
                                            <button type="button" class="dropdown-item text-danger" onclick="eliminarCotizacion(${c.id}, '${numeroCot}')">
                                                <i class="bi bi-trash"></i> Eliminar
                                            </button>
                                        </li>
                                        ` : ""}
                                    </ul>
                                </div>
                            </div>
                        </td>
                    </tr>
                `;
            });
        });
}
</script>
{% endblock %}
