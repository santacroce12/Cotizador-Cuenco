{% extends "layout.html" %}

{% block title %}Historial{% endblock %}

{% block content %}
<style>
    .hist-filters { display: grid; grid-template-columns: minmax(220px, 2fr) repeat(2, minmax(140px, 1fr)) auto; gap: 0.75rem; align-items: end; }
    .hist-cliente { font-weight: 500; }
    .hist-familia { font-size: 0.75rem; color: var(--muted-foreground); }
    .hist-total { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .hist-actions { display: inline-flex; gap: 0.25rem; justify-content: flex-end; }
    .table-card .table-responsive { overflow: visible; }
    @media (max-width: 991.98px) {
        .hist-filters { grid-template-columns: 1fr 1fr; }
        .table-card .table-responsive { overflow-x: auto; }
    }
    @media (max-width: 575.98px) { .hist-filters { grid-template-columns: 1fr; } }
    /* Estado como boton: se cambia desde la fila. */
    .estado-btn { cursor: pointer; font-family: inherit; }
    .estado-btn .bi-chevron-down { font-size: 0.65rem; opacity: 0.7; }
    .estado-btn:hover { filter: brightness(0.96); }
    .estado-btn:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--ring-shadow); }
    .estado-btn:disabled { opacity: 0.6; cursor: progress; }
    .estado-menu .dropdown-item { gap: 0.5rem; }
    .estado-menu .dropdown-item.active { background: var(--accent); color: var(--accent-foreground); }
    .estado-dot { width: 0.5rem; height: 0.5rem; border-radius: 50%; display: inline-block; flex: 0 0 auto; }
    .estado-dot.estado-en-progreso { background: var(--warning); }
    .estado-dot.estado-aceptada { background: var(--success); }
    .estado-dot.estado-rechazada { background: var(--danger); }
    .toast-zone { position: fixed; right: 1rem; bottom: 1rem; z-index: 1090; }
    .toast { --bs-toast-bg: var(--popover); --bs-toast-color: var(--popover-foreground); --bs-toast-border-color: var(--border); --bs-toast-border-radius: var(--radius); box-shadow: var(--shadow-lg); font-size: 0.875rem; }
</style>

<div class="page-header">
    <div>
        <h1 class="page-title">Historial</h1>
        <p class="page-description">Todas las cotizaciones emitidas. Importes en dólares.</p>
    </div>
    <div class="segmented" role="tablist" aria-label="Filtrar por estado" id="filtro-estado">
        <button type="button" class="active" data-estado="">Todas</button>
        <button type="button" data-estado="En progreso">En progreso</button>
        <button type="button" data-estado="Aceptada">Aceptadas</button>
        <button type="button" data-estado="Rechazada">Rechazadas</button>
    </div>
</div>

<div class="card mb-4">
    <div class="card-body py-3">
        <div class="hist-filters">
            <div>
                <label class="form-label" for="filtro_cliente_id">Cliente</label>
                <select id="filtro_cliente_id" class="form-select">
                    <option value="">Buscar por nombre, razón social o CUIT...</option>
                    {% for c in clientes %}
                    <option value="{{ c.id }}" data-data='{{ {"nombre": c.nombre or "", "razon": c.razon_social or "", "cuit": c.cuit or ""}|tojson|safe }}'>
                        {{ c.nombre }}{% if c.razon_social %} | {{ c.razon_social }}{% endif %}{% if c.cuit %} ({{ c.cuit }}){% endif %}
                    </option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="form-label" for="filtro_desde">Desde</label>
                <input type="date" id="filtro_desde" class="form-control" onchange="aplicarFiltros(1)">
            </div>
            <div>
                <label class="form-label" for="filtro_hasta">Hasta</label>
                <input type="date" id="filtro_hasta" class="form-control" onchange="aplicarFiltros(1)">
            </div>
            <div class="d-flex gap-2">
                <button type="button" onclick="limpiarFiltros()" class="btn btn-outline-dark"><i class="bi bi-x-lg"></i>Limpiar</button>
            </div>
        </div>
    </div>
</div>

<div class="card table-card">
    <div class="table-responsive">
        <table class="table align-middle">
            <thead>
                <tr>
                    <th>Número</th>
                    <th>Cliente</th>
                    <th>Fecha</th>
                    <th>Estado</th>
                    <th class="text-end">Total</th>
                    <th class="text-end"><span class="visually-hidden">Acciones</span></th>
                </tr>
            </thead>
            <tbody id="tabla-historial">
                <tr><td colspan="6" class="table-empty"><span class="spinner-border spinner-border-sm" aria-hidden="true"></span> Cargando…</td></tr>
            </tbody>
        </table>
    </div>
    <div id="historial-paginacion" class="card-footer d-none"></div>
</div>

<div class="toast-zone" aria-live="polite" aria-atomic="true">
    <div id="toast-estado" class="toast" role="status">
        <div class="toast-body d-flex align-items-center gap-3">
            <span id="toast-estado-texto" class="flex-grow-1"></span>
            <button type="button" id="toast-estado-deshacer" class="btn btn-outline-dark btn-sm">Deshacer</button>
            <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Cerrar"></button>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let historialPage = 1;
let filtroEstado = "";
const historialPuedeEliminar = {{ "true" if current_user and current_user.is_admin else "false" }};

document.addEventListener("DOMContentLoaded", function () {
    initHistorialClienteSelect();
    document.querySelectorAll("#filtro-estado [data-estado]").forEach((boton) => {
        boton.addEventListener("click", () => {
            document.querySelectorAll("#filtro-estado [data-estado]").forEach((b) => b.classList.toggle("active", b === boton));
            filtroEstado = boton.dataset.estado;
            aplicarFiltros(1);
        });
    });
    aplicarFiltros();
});

function initHistorialClienteSelect() {
    const select = document.getElementById("filtro_cliente_id");
    if (!select || typeof TomSelect === "undefined" || select.tomselect) {
        return;
    }
    new TomSelect(select, {
        maxItems: 1,
        create: false,
        allowEmptyOption: true,
        closeAfterSelect: true,
        plugins: ["clear_button"],
        searchField: ["text", "nombre", "razon", "cuit"],
        sortField: [{ field: "$score" }, { field: "text" }],
        placeholder: "Buscar por nombre, razón social o CUIT...",
        render: {
            option: function (data, escape) {
                const razon = data.razon ? `<small>${escape(data.razon)}</small>` : "";
                const cuit = data.cuit ? `<small>${escape(data.cuit)}</small>` : "";
                return `<div class="cliente-option flex-column align-items-start"><strong>${escape(data.nombre || data.text || "")}</strong>${razon}${cuit}</div>`;
            },
            item: function (data, escape) {
                const nombre = data.nombre || data.text || "";
                return `<div class="cliente-item">${escape(data.razon ? `${nombre} - ${data.razon}` : nombre)}</div>`;
            },
            no_results: function (data, escape) {
                return `<div class="no-results py-2 px-3 text-muted">Sin coincidencias para "${escape(data.input)}"</div>`;
            },
        },
        onChange: function () {
            aplicarFiltros(1);
        },
    });
}

function limpiarFiltros() {
    const select = document.getElementById("filtro_cliente_id");
    select?.tomselect ? select.tomselect.clear(true) : (select.value = "");
    document.getElementById("filtro_desde").value = "";
    document.getElementById("filtro_hasta").value = "";
    aplicarFiltros(1);
}

const ESTADOS_COTIZACION = ["En progreso", "Aceptada", "Rechazada"];

function menuEstado(id, numero, estado) {
    const opciones = ESTADOS_COTIZACION.map((opcion) => `
        <li><button type="button" class="dropdown-item${opcion === estado ? " active" : ""}" ${opcion === estado ? 'aria-current="true"' : ""}
            onclick="cambiarEstadoCotizacion(${id}, '${numero}', '${opcion}', '${escapeHtml(estado)}')">
            <span class="estado-dot ${claseEstado(opcion)}"></span>${opcion}${opcion === estado ? '<i class="bi bi-check2 ms-auto"></i>' : ""}
        </button></li>`).join("");
    return `
        <div class="dropdown">
            <button type="button" id="estado-${id}" class="estado-pill estado-btn ${claseEstado(estado)}" data-bs-toggle="dropdown"
                data-bs-popper-config='{"strategy":"fixed"}' aria-expanded="false" title="Cambiar estado" aria-label="Estado de ${numero}: ${escapeHtml(estado)}. Cambiar estado">
                ${escapeHtml(estado)}<i class="bi bi-chevron-down"></i>
            </button>
            <ul class="dropdown-menu estado-menu">
                <li class="dropdown-header">Cambiar estado</li>
                ${opciones}
            </ul>
        </div>`;
}

async function cambiarEstadoCotizacion(id, numero, estado, estadoAnterior, esDeshacer = false) {
    if (estado === estadoAnterior) {
        return;
    }
    const boton = document.getElementById(`estado-${id}`);
    if (boton) {
        boton.disabled = true;
    }
    try {
        const response = await fetch(`/cotizacion/${id}/estado`, {
            method: "POST",
            headers: { "Content-Type": "application/json", "X-Requested-With": "XMLHttpRequest" },
            body: JSON.stringify({ estado }),
        });
        const data = await response.json().catch(() => ({}));
        if (response.status === 401) {
            window.location.href = "{{ url_for('login') }}";
            return;
        }
        if (!response.ok) {
            throw new Error(data.error || "No se pudo cambiar el estado.");
        }
        // Se recarga la pagina actual: si hay filtro por estado, la fila puede salir de la lista.
        await aplicarFiltros(historialPage);
        mostrarToastEstado(
            esDeshacer ? `${numero} volvió a ${estado}.` : `${numero} pasó a ${estado}.`,
            esDeshacer ? null : () => cambiarEstadoCotizacion(id, numero, estadoAnterior, estado, true)
        );
    } catch (error) {
        if (boton) {
            boton.disabled = false;
        }
        mostrarToastEstado(error.message || "No se pudo cambiar el estado.", null);
    }
}

function mostrarToastEstado(texto, deshacer) {
    const toast = document.getElementById("toast-estado");
    const boton = document.getElementById("toast-estado-deshacer");
    document.getElementById("toast-estado-texto").textContent = texto;
    boton.classList.toggle("d-none", !deshacer);
    boton.onclick = deshacer ? () => { bootstrap.Toast.getOrCreateInstance(toast).hide(); deshacer(); } : null;
    bootstrap.Toast.getOrCreateInstance(toast, { delay: 6000 }).show();
}

function claseEstado(estado) {
    if (estado === "Aceptada") return "estado-aceptada";
    if (estado === "Rechazada") return "estado-rechazada";
    return "estado-en-progreso";
}

function formatoUsd(valor, moneda) {
    const numero = Number(valor || 0).toLocaleString("es-AR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    return `${moneda === "ARS" ? "$" : "US$"} ${numero}`;
}

function renderHistorialPaginacion(meta) {
    const contenedor = document.getElementById("historial-paginacion");
    if (!meta || !meta.total) {
        contenedor.classList.add("d-none");
        contenedor.innerHTML = "";
        return;
    }
    const paginas = (meta.pages_visible || []).map((page) => {
        if (page === null) {
            return `<li class="page-item disabled"><span class="page-link">…</span></li>`;
        }
        return `<li class="page-item${page === meta.page ? " active" : ""}"><button type="button" class="page-link" onclick="aplicarFiltros(${page})">${page}</button></li>`;
    }).join("");
    contenedor.classList.remove("d-none");
    contenedor.className = "card-footer d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-2";
    contenedor.innerHTML = `
        <div class="small text-muted">${meta.start}–${meta.end} de ${meta.total} cotizaciones</div>
        <nav aria-label="Paginación historial">
            <ul class="pagination pagination-sm mb-0">
                <li class="page-item${meta.has_prev ? "" : " disabled"}"><button type="button" class="page-link" ${meta.has_prev ? `onclick="aplicarFiltros(${meta.prev_page})"` : ""}><i class="bi bi-chevron-left"></i>&nbsp;Anterior</button></li>
                ${paginas}
                <li class="page-item${meta.has_next ? "" : " disabled"}"><button type="button" class="page-link" ${meta.has_next ? `onclick="aplicarFiltros(${meta.next_page})"` : ""}>Siguiente&nbsp;<i class="bi bi-chevron-right"></i></button></li>
            </ul>
        </nav>`;
}

async function accionJson(url, mensajeError) {
    try {
        const response = await fetch(url, { method: "POST", headers: { "X-Requested-With": "XMLHttpRequest" } });
        const data = await response.json().catch(() => ({}));
        if (response.status === 401) {
            window.location.href = "{{ url_for('login') }}";
            return null;
        }
        if (!response.ok) {
            alert(data?.error === "admin_required" ? "Solo un administrador puede hacer esto." : (data?.error || mensajeError));
            return null;
        }
        return data;
    } catch (_error) {
        alert(mensajeError);
        return null;
    }
}

async function eliminarCotizacion(id, numero) {
    if (!historialPuedeEliminar || !window.confirm(`¿Borrar por completo la cotización ${numero}? No se puede deshacer.`)) {
        return;
    }
    if (await accionJson(`/cotizacion/${id}/eliminar`, "No se pudo borrar la cotización.")) {
        aplicarFiltros(historialPage);
    }
}

async function clonarCotizacion(id, numero) {
    if (!window.confirm(`¿Crear una copia de la cotización ${numero} con fecha de hoy y estado En progreso?`)) {
        return;
    }
    const data = await accionJson(`/cotizacion/clonar/${id}`, "No se pudo duplicar la cotización.");
    if (data) {
        window.location.href = data.redirect_url || `/cotizacion/${data.nueva_id}/editar`;
    }
}

function filaHistorial(c, index, total) {
    const id = Number(c.id);
    const numero = escapeHtml(c.numero_cotizacion || String(id).padStart(4, "0"));
    const estado = c.estado || "En progreso";
    const direccion = index >= Math.max(total - 2, 0) && total > 3 ? "dropup" : "dropdown";
    const familia = c.familia ? `<div class="hist-familia">${escapeHtml(c.familia)}</div>` : "";
    const moneda = (c.moneda || "USD").toUpperCase();
    const etiquetaArs = moneda === "ARS" ? `<span class="moneda-tag tag-ars">ARS</span>` : "";
    const eliminar = historialPuedeEliminar ? `
        <li><hr class="dropdown-divider"></li>
        <li><button type="button" class="dropdown-item text-danger" onclick="eliminarCotizacion(${id}, '${numero}')"><i class="bi bi-trash"></i>Eliminar</button></li>` : "";
    return `
        <tr>
            <td><a href="/cotizacion/${id}" class="badge badge-outline badge-mono text-decoration-none">${numero}</a></td>
            <td>
                <div class="hist-cliente">${escapeHtml(c.cliente_nombre || c.cliente || "Sin cliente")}</div>
                ${familia}
            </td>
            <td class="text-muted tabular-nums text-nowrap">${escapeHtml(c.fecha)}</td>
            <td>${menuEstado(id, numero, estado)}</td>
            <td class="text-end hist-total">${etiquetaArs}${formatoUsd(c.total_final, moneda)}</td>
            <td class="text-end">
                <div class="hist-actions">
                    <a href="/cotizacion/${id}/pdf" class="btn btn-ghost btn-sm btn-icon" title="Descargar PDF" aria-label="Descargar PDF de ${numero}"><i class="bi bi-file-earmark-pdf"></i></a>
                    <a href="/cotizacion/${id}/editar" class="btn btn-outline-dark btn-sm">Editar</a>
                    <div class="${direccion}">
                        <button type="button" class="btn btn-ghost btn-sm btn-icon" data-bs-toggle="dropdown" data-bs-boundary="viewport" aria-expanded="false" aria-label="Más acciones para ${numero}"><i class="bi bi-three-dots"></i></button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li class="dropdown-header">${numero}</li>
                            <li><a href="/cotizacion/${id}" class="dropdown-item"><i class="bi bi-eye"></i>Ver presupuesto</a></li>
                            <li><a href="/cotizacion/${id}/llave-en-mano" class="dropdown-item"><i class="bi bi-file-text"></i>Consolidada (llave en mano)</a></li>
                            <li><a href="/cotizacion/${id}/xlsx" class="dropdown-item"><i class="bi bi-file-earmark-lock"></i>Excel interno (costos y márgenes)</a></li>
                            <li><button type="button" class="dropdown-item" onclick="clonarCotizacion(${id}, '${numero}')"><i class="bi bi-copy"></i>Duplicar</button></li>
                            ${eliminar}
                        </ul>
                    </div>
                </div>
            </td>
        </tr>`;
}

async function aplicarFiltros(page = historialPage) {
    const clienteSelect = document.getElementById("filtro_cliente_id");
    const clienteId = clienteSelect?.value || "";
    const clienteTexto = clienteSelect?.tomselect?.control_input?.value?.trim() || "";
    const params = new URLSearchParams({
        desde: document.getElementById("filtro_desde").value,
        hasta: document.getElementById("filtro_hasta").value,
    });
    historialPage = page || 1;
    params.set("page", historialPage);
    if (clienteId) {
        params.set("cliente_id", clienteId);
    } else if (clienteTexto) {
        params.set("cliente", clienteTexto);
    }
    if (filtroEstado) {
        params.set("estado", filtroEstado);
    }

    const tbody = document.getElementById("tabla-historial");
    let data;
    try {
        const response = await fetch(`/filtrar_historial?${params.toString()}`);
        data = await response.json();
    } catch (_error) {
        tbody.innerHTML = `<tr><td colspan="6" class="table-empty"><i class="bi bi-wifi-off"></i>No se pudo cargar el historial.</td></tr>`;
        return;
    }
    if (!data || !Array.isArray(data.items)) {
        if (data && data.error === "auth_required") {
            window.location.href = "{{ url_for('login') }}";
        }
        return;
    }
    renderHistorialPaginacion(data.pagination);
    if (!data.items.length) {
        tbody.innerHTML = `<tr><td colspan="6" class="table-empty"><i class="bi bi-inbox"></i>No hay cotizaciones para este filtro.</td></tr>`;
        return;
    }
    tbody.innerHTML = data.items.map((c, i) => filaHistorial(c, i, data.items.length)).join("");
}
</script>
{% endblock %}
