<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cotizador</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon-cuencotech.svg') }}?v=20260318b">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tom-select/dist/css/tom-select.bootstrap5.min.css">
    <style>
        :root {
            --primary-color: #2563eb;
            --dark-color: #111827;
            --dark-header: #0f172a;
            --border-color: #d5e0ea;
            --surface-color: rgba(246, 249, 252, 0.95);
            --surface-color-strong: rgba(238, 243, 248, 0.98);
            --surface-muted: #e8eef5;
            --line-soft: #cfd9e4;
            --table-shell: #dfe7f0;
            --table-surface: #eff4f9;
            --table-surface-alt: #e7eef6;
            --text-color: #1f2937;
        }
        body {
            background:
                radial-gradient(circle at top left, rgba(37, 99, 235, 0.09), transparent 24%),
                radial-gradient(circle at top right, rgba(15, 23, 42, 0.10), transparent 22%),
                linear-gradient(180deg, #edf2f7 0%, #f5f7fa 52%, #edf3f7 100%);
            color: var(--text-color);
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            position: relative;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: 0.3;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.42) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.42) 1px, transparent 1px);
            background-size: 36px 36px;
        }
        .navbar-brand img { height: 40px; }
        .navbar {
            background: rgba(17, 24, 39, 0.94) !important;
            backdrop-filter: blur(14px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .nav-link { font-weight: 500; }
        .nav-link.active { color: #93c5fd !important; border-bottom: 2px solid #60a5fa; }
        .container.my-5 {
            position: relative;
        }
        .card {
            border: 1px solid rgba(213, 224, 234, 0.9);
            border-radius: 20px;
            background: var(--surface-color);
            box-shadow:
                0 24px 52px rgba(15, 23, 42, 0.08),
                0 4px 18px rgba(15, 23, 42, 0.05);
        }
        .page-surface {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(246, 249, 252, 0.98));
        }
        .soft-card {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.94), rgba(242, 246, 250, 0.98));
        }
        .surface-strip {
            background: linear-gradient(180deg, #f5f8fb 0%, #ecf2f8 100%);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.85);
        }
        .summary-panel {
            background: linear-gradient(160deg, #111827 0%, #1f2937 100%) !important;
            border: 1px solid rgba(148, 163, 184, 0.24);
            box-shadow: 0 22px 44px rgba(15, 23, 42, 0.22);
        }
        .card-header.bg-dark {
            background: linear-gradient(180deg, #18212d 0%, #101720 100%) !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            letter-spacing: 0.02em;
        }

        .table thead th {
            background: linear-gradient(180deg, #111827 0%, #0f172a 100%) !important;
            color: #ffffff !important;
            border: none;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.07em;
            padding: 14px 12px;
        }

        .thead-dark-custom th {
            background: linear-gradient(180deg, #111827 0%, #0f172a 100%) !important;
            color: #ffffff !important;
        }

        .table-custom {
            border: none;
            border-radius: 14px;
            overflow: hidden;
            background: var(--table-surface);
        }

        .historial-header {
            background-color: #000 !important;
            color: #fff !important;
        }

        .moneda-tag {
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 800;
            margin-right: 5px;
        }

        .tag-usd {
            background-color: #d1fae5;
            color: #065f46;
            border: 1px solid #065f46;
        }

        .tag-ars {
            background-color: #e0f2fe;
            color: #075985;
            border: 1px solid #075985;
        }

        .table-container {
            background: linear-gradient(180deg, #dbe5ef 0%, #e8eff6 100%);
            border-radius: 20px;
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.85),
                0 16px 32px rgba(15, 23, 42, 0.06);
            overflow: hidden;
            border: 1px solid #c5d1dc;
            padding: 10px;
        }

        .table td {
            border-bottom: 1px solid var(--line-soft);
            font-size: 0.95rem;
            vertical-align: middle;
            color: #334155;
            background-color: transparent;
        }

        .table tbody tr:nth-child(odd) {
            background-color: var(--table-surface);
        }
        .table tbody tr:nth-child(even) {
            background-color: var(--table-surface-alt);
        }
        .table tbody tr:hover {
            background-color: #dbe7f4;
        }
        .table tbody tr:hover td {
            background-color: #dbe7f4;
        }
        .table > :not(caption) > * > * {
            box-shadow: inset 0 -1px 0 var(--line-soft);
        }
        .table-responsive {
            border-radius: 14px;
            overflow: hidden;
        }
        .table-grid-outline {
            border: 1px solid #bcc9d6;
            border-radius: 16px;
            background: linear-gradient(180deg, #dde6ef 0%, #e7eef6 100%);
            padding: 10px;
        }

        .form-select, .form-control {
            border: 1px solid #c8d3df;
            border-radius: 12px;
            padding: 10px 12px;
            background-color: rgba(255, 255, 255, 0.88);
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.9);
        }

        .form-select:focus, .form-control:focus {
            border-color: #2563eb;
            outline: none;
            box-shadow: 0 0 0 0.24rem rgba(37, 99, 235, 0.14);
        }

        select[name="iva_item[]"],
        .select-iva {
            max-width: 90px;
            font-size: 0.9rem;
            background-color: #f8f9fa;
            border: 1px solid #000;
            font-weight: bold;
            text-align: center;
        }

        .ganancia-badge {
            background-color: #000;
            color: #00ff00;
            padding: 5px 10px;
            border-radius: 4px;
            font-family: monospace;
        }

        .btn-dark-custom {
            background: linear-gradient(180deg, #111827 0%, #0f172a 100%);
            color: white;
            border: none;
            transition: 0.3s;
        }
        .btn-dark-custom:hover {
            background: linear-gradient(180deg, #1f2937 0%, #111827 100%);
            color: #fff;
        }
        .btn-dark-custom.active {
            background: linear-gradient(180deg, #2563eb 0%, #1d4ed8 100%);
            color: #fff;
        }

        .btn-edit-custom {
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
            color: #f8fafc;
            border: 1px solid rgba(148, 163, 184, 0.28);
        }

        .btn-edit-custom:hover {
            background: linear-gradient(180deg, #334155 0%, #1e293b 100%);
            color: #ffffff;
            border-color: rgba(148, 163, 184, 0.42);
        }

        .btn-view-custom {
            background: linear-gradient(180deg, #1d4ed8 0%, #1e3a8a 100%);
            color: #eff6ff;
            border: 1px solid rgba(96, 165, 250, 0.3);
        }

        .btn-view-custom:hover {
            background: linear-gradient(180deg, #2563eb 0%, #1d4ed8 100%);
            color: #ffffff;
            border-color: rgba(147, 197, 253, 0.45);
        }

        .ts-wrapper.single .ts-control,
        .ts-wrapper.single.input-active .ts-control {
            border: 1px solid #ced4da;
            border-radius: 0.375rem;
            min-height: 42px;
            box-shadow: none;
        }

        .input-group > .ts-wrapper {
            flex: 1 1 auto;
            width: 1%;
        }

        .input-group > .ts-wrapper .ts-control {
            border-top-right-radius: 0;
            border-bottom-right-radius: 0;
        }

        .ts-wrapper.focus .ts-control {
            border-color: #1a1a1a;
            box-shadow: 0 0 0 0.2rem rgba(26, 26, 26, 0.1);
        }

        .ts-dropdown {
            border: 1px solid #111;
            border-radius: 0.5rem;
            overflow: hidden;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.12);
        }

        .ts-dropdown .active {
            background: #111;
            color: #fff;
        }

        .cliente-option {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .cliente-option small {
            color: #6c757d;
            white-space: nowrap;
        }

        .cliente-item {
            font-weight: 600;
        }

        .estado-pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 122px;
            padding: 0.38rem 0.75rem;
            border-radius: 999px;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.03em;
            border: 1px solid transparent;
        }

        .estado-en-progreso {
            background: #78350f;
            color: #fef3c7;
            border-color: #b45309;
        }

        .estado-aceptada {
            background: #14532d;
            color: #dcfce7;
            border-color: #15803d;
        }

        .estado-rechazada {
            background: #7f1d1d;
            color: #fee2e2;
            border-color: #b91c1c;
        }

        .estado-select {
            min-width: 150px;
            font-size: 0.88rem;
            font-weight: 600;
            border-radius: 12px;
        }

        .estado-select.estado-en-progreso {
            background: #fff7ed;
            color: #9a3412;
            border-color: #fdba74;
        }

        .estado-select.estado-aceptada {
            background: #f0fdf4;
            color: #166534;
            border-color: #86efac;
        }

        .estado-select.estado-rechazada {
            background: #fef2f2;
            color: #991b1b;
            border-color: #fca5a5;
        }

        .estado-select:focus {
            box-shadow: 0 0 0 0.2rem rgba(37, 99, 235, 0.12);
        }

        .estado-stack {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.55rem;
        }

        @media print {
            .no-print { display: none !important; }
            body { background: #fff !important; }
            .container { width: 100% !important; max-width: 100% !important; margin: 0 !important; }
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm no-print">
    <div class="container">
        <a class="navbar-brand" href="/">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="Cuenco Tech Logo">
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-collapse nav navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">
                        <i class="bi bi-file-earmark-plus"></i> Nuevo Presupuesto
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.path == '/historial' %}active{% endif %}" href="/historial">
                        <i class="bi bi-clock-history"></i> Historial
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.path == '/dashboard' %}active{% endif %}" href="/dashboard">
                        <i class="bi bi-speedometer2"></i> Dashboard
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container my-5">
    {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tom-select/dist/js/tom-select.complete.min.js"></script>
</body>
</html>
